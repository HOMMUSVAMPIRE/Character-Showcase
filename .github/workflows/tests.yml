# Runs the project hygiene check and the Unity PlayMode test suite on every push and pull request.
#
# Setup (once, in the repository's Settings > Secrets and variables > Actions):
#   UNITY_EMAIL     - the Unity account email
#   UNITY_PASSWORD  - the Unity account password
#   UNITY_LICENSE   - the contents of a Unity license file (.ulf). Personal licenses: see
#                     https://game-ci.com/docs/github/activation for how to obtain one.
#                     (For Unity Pro/Plus, use UNITY_SERIAL instead of UNITY_LICENSE and add it to `env` below.)
#
# The Unity version is read from ProjectSettings/ProjectVersion.txt. GameCI must publish an editor image for that
# exact version; if the job fails to pull one, set `unityVersion` below to the nearest available version, or point
# `customImage` at an image you build.

name: Tests

# Documentation-only changes (Markdown files and docs/) don't trigger a run.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Only the newest run per branch or pull request matters; a new push cancels the run in progress on the same ref.
# Batch code changes into fewer pushes rather than pushing every commit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # lets the test runner publish a check with per-test results

jobs:
  hygiene:
    name: Project hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # The runner image already has Python 3, which is all the hygiene check needs.
      - name: Check .meta files, GUIDs, assembly boundaries and reflected test fields
        run: python3 Tools/CI/check_project_hygiene.py

  playmode:
    name: PlayMode tests
    needs: hygiene # no point spending Unity minutes on a project with broken .meta files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Unity editor images are large; make room on the runner first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v5
        with:
          lfs: false # the project doesn't use Git LFS

      # The Library folder is Unity's import cache. Restoring it turns a long first import into a short one.
      - name: Restore Unity Library cache
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}-${{ hashFiles('Assets/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}-
            Library-${{ runner.os }}-

      - name: Run PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: playmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode test results
          # unityVersion: 6000.6.7f1  # defaults to ProjectSettings/ProjectVersion.txt
          # customImage: ...          # see the note at the top of this file

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath || 'test-results' }}
          if-no-files-found: warn
