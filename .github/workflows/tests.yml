# Runs the project hygiene check and the Unity test suites (EditMode and PlayMode) on every push and pull request.
#
# Setup (once, in the repository's Settings > Secrets and variables > Actions):
#   UNITY_EMAIL     - the Unity account email
#   UNITY_PASSWORD  - the Unity account password
#   UNITY_LICENSE   - the contents of a Unity license file (.ulf). Personal licenses: see
#                     https://game-ci.com/docs/github/activation for how to obtain one.
#                     (For Unity Pro/Plus, use UNITY_SERIAL instead of UNITY_LICENSE and add it to `env` below.)
#
# The Unity version is read from ProjectSettings/ProjectVersion.txt. GameCI must publish an editor image for that
# exact version; if the job fails to pull one, set `unityVersion` below to the nearest available version, or point
# `customImage` at an image you build.

name: Tests

# Documentation-only changes (Markdown files and docs/) don't trigger a run.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Only the newest run per branch or pull request matters; a new push cancels the run in progress on the same ref.
# Batch code changes into fewer pushes rather than pushing every commit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # lets the test runner publish a check with per-test results
  pull-requests: read # lets the change filter list a pull request's files

jobs:
  hygiene:
    name: Project hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # The runner image already has Python 3, which is all the hygiene check needs.
      - name: Check .meta files, GUIDs, assembly boundaries and reflected test fields
        run: python3 Tools/CI/check_project_hygiene.py
      # The levelspec tool (Tools/LevelSpec) needs only Python 3 too: its specs, formats, checks and schematics.
      - name: Test the level spec tool
        run: python3 -m unittest discover -s Tools/LevelSpec/tests
      # So does the test runner (Tools/run_tests.py), tested with a fake Unity and canned results: no Unity needed.
      - name: Test the test runner script
        run: python3 -m unittest discover -s Tools/Tests
      # The Blender scripts (Tools/Mannequin, Tools/Fox, Tools/Animation) only run inside Blender, which CI hasn't got,
      # but their syntax can be checked without it (compiling them doesn't import bpy).
      - name: Check every Python script compiles
        run: find Tools -name '*.py' -print0 | xargs -0 python3 -m py_compile

  # Whether anything the Unity tests read changed: the project (Assets, Packages, ProjectSettings), the two files under
  # Tools they read (the movement envelope and the level spec schema), or this workflow. A change only to the Python
  # tools, the CI script or the docs has nothing for the Unity job to test, which takes up to an hour.
  changes:
    name: Find what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unity: ${{ steps.filter.outputs.unity }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            unity:
              - 'Assets/**'
              - 'Packages/**'
              - 'ProjectSettings/**'
              - 'Tools/LevelSpec/envelope.json'
              - 'Tools/LevelSpec/level-spec.schema.json'
              - '.github/workflows/tests.yml'

  unity-tests:
    name: EditMode and PlayMode tests
    # No point spending Unity minutes on a project with broken .meta files, or on a change the Unity tests can't see (run
    # by hand, it always runs).
    needs: [hygiene, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Unity editor images are large; make room on the runner first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # The motion-capture clips and other large assets are stored with Git LFS. Rather than downloading every LFS file
      # on every run (which counts against the repository's LFS bandwidth), they're kept in a cache keyed on the list of
      # LFS objects, and only what the cache lacks is pulled.
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: List the LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f 1 | sort > .lfs-objects
      - name: Restore the LFS cache
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull

      # The Library folder is Unity's import cache. Restoring it turns a long first import into a short one. Any older
      # Library is better than none (Unity reimports only what changed), so the key changes only when the set of assets
      # or their import settings do (the .meta files), not on every commit: each new key is a new multi-GB entry, which
      # pushes older ones out of the repository's cache.
      - name: Restore Unity Library cache
        id: library
        uses: actions/cache/restore@v5
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}-${{ hashFiles('Assets/**/*.meta') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}-
            Library-${{ runner.os }}-

      - name: Run EditMode and PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results
          # unityVersion: 6000.6.7f1  # defaults to ProjectSettings/ProjectVersion.txt
          # customImage: ...          # see the note at the top of this file

      # Saved whether the tests passed or failed (the project imported either way), so a red run's import isn't lost,
      # but not from a cancelled run (a newer push superseding it): stopped mid-import, its Library could be half
      # written, and every later run would restore it. Skipped when this exact key was restored (it's saved already).
      - name: Save Unity Library cache
        if: (success() || failure()) && steps.library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Library
          key: ${{ steps.library.outputs.cache-primary-key }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath || 'test-results' }}
          if-no-files-found: warn
